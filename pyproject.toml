[project]
name = "faresweep"
version = "0.2.0"
description = "FareSweep: headless flight-search API over Google Flights (tfs= URLs, Playwright)."
requires-python = ">=3.9"

[tool.ruff]
target-version = "py39"
line-length = 100
extend-exclude = [".venv", "tests/fixtures"]

[tool.ruff.lint]
# E/W pycodestyle, F pyflakes, I import-sort, B bugbear, UP pyupgrade.
select = ["E", "W", "F", "I", "B", "UP"]
# E501: long lines are tolerated in this codebase (URLs, blobs, comments).
# E731: a couple of intentional lambda assignments in the job store.
ignore = ["E501", "E731"]

[tool.ruff.lint.per-file-ignores]
# Tests insert the repo root on sys.path before importing app.*.
"tests/*" = ["E402"]
# CLI shims re-export engine internals for backward-compatible imports.
"cheapest_dub_*.py" = ["F401", "E402"]
